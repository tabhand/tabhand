<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabhand</title>
    <style>
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url('assets/geist.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-weight: 100 900;
        src: url('assets/geist-mono.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        src: url('assets/instrument-serif-italic.woff2') format('woff2');
      }
      :root {
        --paper: #fcf9f2;
        --ink: #161817;
        --mute: rgba(22, 24, 23, 0.6);
        --line: rgba(22, 24, 23, 0.12);
        --hot: #e0573c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 13px/1.45 Geist, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      /* The painted sky from tabhand.dev, with grain, fading into the paper. */
      .band {
        position: relative;
        height: 128px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .paint {
        position: absolute;
        inset: 0;
        background: url('assets/sky.jpg') center 38% / cover;
        transition: filter 0.4s ease;
      }
      .band::before {
        content: '';
        position: absolute;
        inset: 0;
        background: url('assets/grain.png') 0 0 / 160px;
        mix-blend-mode: overlay;
        opacity: 0.35;
      }
      .band::after {
        content: '';
        position: absolute;
        inset: auto 0 0 0;
        height: 46px;
        background: linear-gradient(transparent, var(--paper));
      }
      [data-state='paused'] .paint {
        filter: grayscale(0.85) brightness(1.02);
      }
      [data-state='setup'] .paint,
      [data-state='away'] .paint {
        filter: hue-rotate(-14deg) saturate(1.1) brightness(0.95);
      }
      .top {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      .chip {
        margin-left: auto;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 6px 9px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(8px);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        font: 500 10.5px/1 'Geist Mono', ui-monospace, monospace;
        letter-spacing: 0.02em;
      }
      .chip:hover {
        background: rgba(255, 255, 255, 0.8);
      }
      h1 {
        position: relative;
        z-index: 1;
        margin: 0 0 2px;
        font: 700 24px/1.05 Geist, sans-serif;
        letter-spacing: -0.035em;
      }
      .mark {
        display: inline-block;
        margin-left: 1px;
        padding: 1px 7px 3px 5px;
        background: var(--hot);
        box-shadow: 0 6px 18px -6px rgba(224, 87, 60, 0.7);
        color: #fff;
        font: italic 400 27px/1 'Instrument Serif', Georgia, serif;
        letter-spacing: -0.01em;
        transform: rotate(-1deg);
      }
      [data-state='paused'] .mark {
        background: #6b7280;
        box-shadow: 0 6px 18px -6px rgba(60, 60, 70, 0.5);
      }

      .body {
        padding: 6px 16px 14px;
      }
      .label {
        display: flex;
        gap: 6px;
        margin: 6px 0;
        color: var(--mute);
        font: 500 10.5px/1 'Geist Mono', ui-monospace, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .label b {
        color: var(--ink);
        font-weight: 500;
      }
      .agent {
        display: flex;
        align-items: center;
        gap: 10px;
        width: calc(100% + 4px);
        margin: 0 -2px 6px;
        padding: 9px 10px;
        border: 0;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 0 0 1px var(--line);
        text-align: left;
      }
      .agent:hover {
        box-shadow: 0 0 0 1px rgba(22, 24, 23, 0.28);
      }
      .agent svg {
        flex: none;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
      }
      .who {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .who b {
        font-weight: 600;
      }
      .who span {
        overflow: hidden;
        color: var(--mute);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .live {
        flex: none;
        width: 7px;
        height: 7px;
        margin-left: auto;
        border-radius: 50%;
        background: #34a26b;
        box-shadow: 0 0 0 4px rgba(52, 162, 107, 0.16);
      }
      [data-state='paused'] .agent {
        opacity: 0.62;
      }
      [data-state='paused'] .live {
        display: none;
      }
      .lede {
        margin: 4px 0 10px;
      }
      .note {
        margin: 9px 2px 0;
        color: var(--mute);
        font-size: 11.5px;
      }
      .pill {
        display: block;
        width: 100%;
        margin: 12px 0 0;
        padding: 11px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font: 600 13.5px/1 Geist, sans-serif;
        letter-spacing: -0.01em;
      }
      .pill.hot {
        background: var(--hot);
        box-shadow: 0 8px 20px -8px rgba(224, 87, 60, 0.8);
        color: #fff;
      }
      .pill.small {
        width: auto;
        margin: 0;
        padding: 9px 14px;
      }
      .pill:active,
      .agent:active,
      .code:active {
        transform: translateY(1px);
      }
      .code {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 11px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: #f3efe6;
        font: 500 12.5px/1 'Geist Mono', ui-monospace, monospace;
      }
      .code svg {
        margin-left: auto;
        opacity: 0.6;
      }
      .dollar {
        color: #f0a07f;
      }
      .naming {
        margin-top: 14px;
      }
      .name {
        display: flex;
        gap: 6px;
      }
      .name input {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 0 1px var(--line);
        color: var(--ink);
        font: 13px Geist, sans-serif;
        outline: none;
      }
      .name input:focus {
        box-shadow: 0 0 0 1.5px var(--ink);
      }
      .link {
        padding: 0;
        border: 0;
        background: none;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .note .link {
        color: var(--ink);
      }
      .error {
        color: var(--hot);
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
        color: var(--mute);
        font: 500 11px/1 'Geist Mono', ui-monospace, monospace;
      }
      footer span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      footer b {
        color: var(--ink);
        font-weight: 600;
      }
      footer .link {
        color: var(--ink);
        font: inherit;
      }
    </style>
  </head>
  <body data-state="away">
    <header class="band">
      <i class="paint"></i>
      <div class="top">
        <svg viewBox="0 0 128 128" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b5cf6" />
              <stop offset="1" stop-color="#2563eb" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="30" fill="url(#logo)" />
          <polygon points="5,4 5.8,23.2 10.6,18.4 19.6,17.8" transform="translate(16 7) scale(4.6)" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" />
        </svg>
        <b>Tabhand</b>
        <button class="chip" id="chip" type="button" title="Name this profile"></button>
      </div>
      <h1 id="headline"></h1>
    </header>

    <main class="body">
      <section id="agents" hidden>
        <p class="label"><span id="agents-label"></span><b id="agents-count"></b></p>
        <div id="agent-list"></div>
      </section>
      <p class="lede" id="lede" hidden></p>
      <button class="code" id="command" type="button" title="Copy" hidden>
        <span class="dollar">$</span> npx tabhand setup
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <rect x="5.5" y="5.5" width="8" height="8" rx="1.6" />
          <path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5" />
        </svg>
      </button>
      <button class="pill" id="toggle" type="button" hidden></button>
      <p class="note" id="note" hidden></p>

      <form id="naming" class="naming" hidden>
        <p class="label">Name this profile</p>
        <div class="name">
          <input id="name" maxlength="100" placeholder="Personal, Work, Client…" autocomplete="off" />
          <button class="pill small" type="submit">Save</button>
        </div>
        <p class="note" id="name-status">Agents use the name to tell your Chrome profiles apart. <button class="link" id="email" type="button">Use this profile’s Google email</button></p>
      </form>
    </main>

    <footer>
      <span id="footer-text"></span>
      <button class="link" id="footer-link" type="button"></button>
    </footer>

    <script type="module" src="panel.js"></script>
  </body>
</html>
