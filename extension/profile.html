<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Name this profile · Tabhand</title>
    <style>
      :root {
        --paper: #fcf9f2;
        --ink: #161817;
        --mute: rgba(22, 24, 23, 0.62);
        --line: rgba(22, 24, 23, 0.16);
        --accent: #e8573c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 26px 28px;
        background: var(--paper);
        color: var(--ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font: italic 400 26px/1.15 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      p {
        margin: 0 0 18px;
        color: var(--mute);
      }
      form {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: var(--ink);
      }
      button {
        padding: 9px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: var(--paper);
        font: 600 14px/1.5 inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .link {
        margin-top: 12px;
        padding: 0;
        background: none;
        color: var(--ink);
        font-weight: 400;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #status {
        min-height: 21px;
        margin: 14px 0 0;
        color: var(--ink);
      }
      #status.error {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Name this profile</h1>
    <p>Agents see this name, so when you ask for your “work profile” they know which Chrome profile you mean.</p>
    <form id="form">
      <input id="name" maxlength="100" placeholder="Work, Personal, Client…" autocomplete="off" autofocus />
      <button type="submit">Save</button>
    </form>
    <button class="link" id="email" type="button">Use this profile’s Google email</button>
    <div id="status" role="status"></div>
    <script src="profile.js"></script>
  </body>
</html>
